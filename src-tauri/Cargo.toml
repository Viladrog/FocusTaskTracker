[package]
name = "focus-task-tracker"
version = "0.2.8"
description = "Edge task tracker prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "focus_task_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
